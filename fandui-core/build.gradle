plugins {
    id "java-library"
    id "maven-publish"
}

base {
    archivesName = "fandui-core"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api project(":fandui-api")
    implementation project(":fandui-canvas")

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register("coreScenePerformanceProbe", JavaExec) {
    group = "verification"
    description = "Measures Core scene-frame time and allocation without running Minecraft."
    dependsOn(tasks.named("testClasses"))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "cn.fandmc.fandui.core.runtime.CoreScenePerformanceProbe"
    jvmArgs "-Xms512m", "-Xmx512m", "-XX:+UseG1GC", "-Xbatch"
    doFirst {
        String requested = providers.gradleProperty("fanduiProbeOutput")
                .getOrElse("artifacts/fandui-core-scene-baseline-20260824.csv")
        systemProperty "fandui.probe.output", rootProject.file(requested).absolutePath
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
