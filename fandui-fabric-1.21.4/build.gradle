plugins {
    id "net.fabricmc.fabric-loom-remap"
    id "maven-publish"
}

base {
    archivesName = "fandui-fabric-1.21.4"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_1214}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1214}"

    implementation project(":fandui-api")
    implementation project(":fandui-canvas")
    implementation project(":fandui-core")
    implementation project(":fandui-text-skija")
    implementation project(":fandui-render-opengl")
    implementation "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version_1214}"
    runtimeOnly "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version_1214}:natives-windows"
    runtimeOnly "io.github.humbleui:skija-windows-x64:${skija_version}"

    include project(":fandui-api")
    include project(":fandui-canvas")
    include project(":fandui-core")
    include project(":fandui-text-skija")
    include project(":fandui-render-opengl")
    include "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version_1214}"
    include "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version_1214}:natives-windows"
    include "io.github.humbleui:skija-shared:${skija_version}"
    include "io.github.humbleui:types:${skija_types_version}"
    include "io.github.humbleui:skija-windows-x64:${skija_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
