plugins {
    id "java-library"
    id "maven-publish"
}

base {
    archivesName = "fandui-render-opengl"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    implementation project(":fandui-canvas")
    implementation project(":fandui-core")
    implementation project(":fandui-text-skija")
    compileOnly "org.lwjgl:lwjgl:${lwjgl_compile_version}"
    compileOnly "org.lwjgl:lwjgl-glfw:${lwjgl_compile_version}"
    compileOnly "org.lwjgl:lwjgl-nanovg:${lwjgl_compile_version}"
    compileOnly "org.lwjgl:lwjgl-opengl:${lwjgl_compile_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.lwjgl:lwjgl-nanovg:${lwjgl_compile_version}"
    testCompileOnly "org.lwjgl:lwjgl:${lwjgl_compile_version}"
    testCompileOnly "org.lwjgl:lwjgl-opengl:${lwjgl_compile_version}"
    testRuntimeOnly "org.lwjgl:lwjgl:${lwjgl_compile_version}:natives-windows"
    testRuntimeOnly "org.lwjgl:lwjgl-nanovg:${lwjgl_compile_version}:natives-windows"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
