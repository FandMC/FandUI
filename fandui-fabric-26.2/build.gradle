plugins {
    id "net.fabricmc.fabric-loom"
    id "maven-publish"
}

base {
    archivesName = "fandui-fabric-26.2"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_262}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_262}"

    implementation project(":fandui-api")
    implementation project(":fandui-canvas")
    implementation project(":fandui-core")
    implementation project(":fandui-text-skija")
    implementation project(":fandui-render-opengl")
    implementation "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version_262}"
    runtimeOnly "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version_262}:natives-windows"
    runtimeOnly "io.github.humbleui:skija-windows-x64:${skija_version}"

    include project(":fandui-api")
    include project(":fandui-canvas")
    include project(":fandui-core")
    include project(":fandui-text-skija")
    include project(":fandui-render-opengl")
    include "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version_262}"
    include "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version_262}:natives-windows"
    include "io.github.humbleui:skija-shared:${skija_version}"
    include "io.github.humbleui:types:${skija_types_version}"
    include "io.github.humbleui:skija-windows-x64:${skija_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
